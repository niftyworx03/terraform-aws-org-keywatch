name: Bug report
description: Something does not work the way the documentation says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything: redact it.**

        This module's logs and outputs are full of things you do not want in a
        public issue — account IDs, organization IDs, ARNs, access key IDs, IAM
        user and role names, and the alert email address.

        Replace them with placeholders like `111111111111`, `o-xxxxxxxxxx`, and
        `AKIAEXAMPLE`. Keep the *shape* of the value so it stays diagnosable.

        If the bug itself is a security weakness in this module, close this and
        [report it privately](https://github.com/niftyworx03/terraform-aws-org-keywatch/security/advisories/new)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Alerter — expected an alert and got none
        - Alerter — got an alert I consider a false positive
        - Heartbeat digest — missing, empty, or wrong contents
        - Dead-man's-switch or error alarms
        - GuardDuty integration
        - CloudTrail, S3 bucket, or log group setup
        - terraform plan / apply / destroy failure
        - Documentation is wrong or misleading
        - Something else
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The API call you made or the Terraform you ran. If an expected alert
        never arrived, say which account the call was made in — member or
        management — since that distinction matters here.
      placeholder: |
        1. Applied with alert_email set and confirmed the subscription
        2. Ran `aws iam create-user --user-name test` in a member account
        3. No email arrived within 10 minutes
    validations:
      required: true

  - type: textarea
    id: function-logs
    attributes:
      label: Function log output
      description: >
        Both functions log a JSON result on every run, which is usually enough
        to identify the problem on its own. Redact before pasting.
      placeholder: |
        aws logs tail /aws/lambda/org-keywatch-alerter --since 1h
        aws logs tail /aws/lambda/org-keywatch-heartbeat --since 2h

        {"received": 2, "matched": 0, "ignored": ["TagRole"]}
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Module configuration
      description: Your module block, with alert_email and any key IDs redacted.
      render: hcl
      placeholder: |
        module "keywatch" {
          source  = "niftyworx03/org-keywatch/aws"
          version = "~> 1.0"

          alert_email           = "REDACTED"
          heartbeat_always_send = true
        }

  - type: input
    id: module-version
    attributes:
      label: Module version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Terraform and AWS provider versions
      description: Output of `terraform version`.
      placeholder: "Terraform v1.9.5, hashicorp/aws v5.62.0"
    validations:
      required: true

  - type: input
    id: accounts
    attributes:
      label: Organization size
      description: >
        Roughly how many accounts, and whether you applied from the management
        account. Several failure modes only appear in multi-account use.
      placeholder: "4 accounts, applied from the management account"

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I removed all account IDs, ARNs, key IDs, and email addresses from this report
          required: true
        - label: I confirmed the SNS email subscription, if this is about a missing notification
        - label: I ran `python3 tests/smoke_test.py` and noted below whether it passed
